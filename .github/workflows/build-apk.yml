name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Baca konfigurasi
        id: cfg
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open("apk.config.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k in ("appName", "appId", "slug", "versionName", "orientation"):
                  f.write(f"{k}={c[k]}\n")
          PY

      - name: Install dependensi Capacitor
        run: npm install --no-audit --no-fund

      - name: Buat project Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate ikon (tidak fatal kalau gagal)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Terapkan versi dan orientasi
        env:
          VNAME: ${{ steps.cfg.outputs.versionName }}
          ORIENT: ${{ steps.cfg.outputs.orientation }}
          RUN_NO: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          g = "android/app/build.gradle"
          s = open(g).read()
          s = re.sub(r"versionCode\s+\d+", "versionCode " + os.environ["RUN_NO"], s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "' + os.environ["VNAME"] + '"', s, count=1)
          open(g, "w").write(s)
          o = os.environ["ORIENT"]
          if o in ("portrait", "landscape"):
              m = "android/app/src/main/AndroidManifest.xml"
              t = open(m).read()
              if "screenOrientation" not in t:
                  t = re.sub(r"<activity\b", '<activity android:screenOrientation="%s"' % o, t, count=1)
                  open(m, "w").write(t)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Siapkan keystore (dibuat sekali, dipakai ulang agar APK bisa di-update)
        run: |
          if [ ! -f signing/release.keystore ]; then
            if [ "${{ github.event.repository.private }}" != "true" ]; then
              echo "::error::Repo ini PUBLIC. Keystore tidak boleh dibuat di repo public. Ubah repo ke Private."
              exit 1
            fi
            mkdir -p signing
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore signing/release.keystore -storetype PKCS12 \
              -alias app -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=${{ steps.cfg.outputs.appName }}, O=Internal, C=ID"
            echo "$PASS" > signing/keystore.pass
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add signing
            git commit -m "chore: add signing key [skip ci]"
            git push
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align dan tanda tangani APK
        env:
          SLUG: ${{ steps.cfg.outputs.slug }}
          VNAME: ${{ steps.cfg.outputs.versionName }}
          RUN_NO: ${{ github.run_number }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out
          OUT="out/${SLUG}-v${VNAME}-b${RUN_NO}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks signing/release.keystore \
            --ks-pass "pass:$(cat signing/keystore.pass)" --ks-key-alias app \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.cfg.outputs.appName }} v${{ steps.cfg.outputs.versionName }} (build ${{ github.run_number }})
          files: out/*.apk
          make_latest: true
